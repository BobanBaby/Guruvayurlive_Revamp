<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="70%" stop-color="#6b1426"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <radialGradient id="flame" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="80%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base with Gold Rim -->
  <rect width="64" height="64" rx="15" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="13" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.8"/>

  <!-- Sloping Kerala Temple Roofline (Gopuram / East Nada) -->
  <path d="M20 33 L32 23 L44 33 L40 33 L32 26 L24 33 Z" fill="#991b1b" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M14 43 L32 28 L50 43 L45 43 L32 32 L19 43 Z" fill="#7f1d1d" stroke="url(#goldGrad)" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M7 54 L32 34 L57 54 L51 54 L32 39 L13 54 Z" fill="#6b1426" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Base Ground Line -->
  <line x1="6" y1="59" x2="58" y2="59" stroke="url(#goldGrad)" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Iconic Deepasthambham (Center Pillar of Lights) -->
  <line x1="32" y1="18" x2="32" y2="59" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Supporting Ladders -->
  <line x1="26" y1="24" x2="23" y2="59" stroke="url(#goldGrad)" stroke-width="1.1" stroke-dasharray="0.5 2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="38" y1="24" x2="41" y2="59" stroke="url(#goldGrad)" stroke-width="1.1" stroke-dasharray="0.5 2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Multi-Tiered Circular Oil Lamp Discs (Stacked Thattu) -->
  <path d="M27 57 Q32 58.5 37 57" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  <path d="M27.5 52 Q32 53.5 36.5 52" fill="none" stroke="url(#goldGrad)" stroke-width="1.9" stroke-linecap="round"/>
  <path d="M28 47 Q32 48.5 36 47" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M28.5 42 Q32 43.5 35.5 42" fill="none" stroke="url(#goldGrad)" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M29 37 Q32 38.5 35 37" fill="none" stroke="url(#goldGrad)" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M29.5 32 Q32 33.5 34.5 32" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M30 27 Q32 28.5 34 27" fill="none" stroke="url(#goldGrad)" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M30.5 22 Q32 23 33.5 22" fill="none" stroke="url(#goldGrad)" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Sacred Radiant Flame at the Apex -->
  <path d="M32 9 C34 13, 35 15, 34 18 C33 20, 31 20, 30 18 C29 15, 30 13, 32 9 Z" fill="url(#flame)"/>
  <ellipse cx="32" cy="16" rx="0.9" ry="1.8" fill="#ffffff"/>
</svg>
