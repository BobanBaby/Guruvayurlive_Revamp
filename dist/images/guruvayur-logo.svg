<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="60%" stop-color="#701a1e"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <radialGradient id="flameGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Medallion -->
  <rect width="160" height="160" rx="36" fill="url(#bgGrad)"/>
  <rect x="5" y="5" width="150" height="150" rx="31" fill="none" stroke="url(#goldStroke)" stroke-width="1.8" opacity="0.75"/>

  <!-- Sacred Incense / Aura Waves -->
  <path d="M25 40 Q40 25 60 42 T100 32 T135 44" fill="none" stroke="url(#goldStroke)" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <path d="M35 28 Q55 16 75 30 T120 22" fill="none" stroke="url(#goldStroke)" stroke-width="1.2" stroke-linecap="round" opacity="0.25"/>

  <!-- Traditional Kerala Temple Gopuram Rooflines (Sloping Pitched Tiled Roofs) -->
  <!-- Upper Tier Roof -->
  <path d="M52 75 L80 54 L108 75 L98 75 L80 61 L62 75 Z" fill="#991b1b" stroke="url(#goldStroke)" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Middle Tier Roof with Kerala Eaves -->
  <path d="M38 100 L80 68 L122 100 L112 100 L80 75 L48 100 Z" fill="#7f1d1d" stroke="url(#goldStroke)" stroke-width="2" stroke-linejoin="round"/>
  <!-- Lower Grand Entrance Sloping Overhang (East Nada Chuttambalam) -->
  <path d="M20 128 L80 82 L140 128 L128 128 L80 91 L32 128 Z" fill="#6b1426" stroke="url(#goldStroke)" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Vertical Temple Pillars -->
  <line x1="36" y1="128" x2="36" y2="148" stroke="url(#goldStroke)" stroke-width="2" stroke-linecap="round"/>
  <line x1="56" y1="128" x2="56" y2="148" stroke="url(#goldStroke)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="104" y1="128" x2="104" y2="148" stroke="url(#goldStroke)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="124" y1="128" x2="124" y2="148" stroke="url(#goldStroke)" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="148" x2="144" y2="148" stroke="url(#goldStroke)" stroke-width="2" stroke-linecap="round"/>

  <!-- Supporting Ladders along Deepasthambham -->
  <line x1="66" y1="58" x2="58" y2="148" stroke="url(#goldStroke)" stroke-width="1.8" stroke-dasharray="0.5 4" stroke-linecap="round" opacity="0.85"/>
  <line x1="94" y1="58" x2="102" y2="148" stroke="url(#goldStroke)" stroke-width="1.8" stroke-dasharray="0.5 4" stroke-linecap="round" opacity="0.85"/>

  <!-- Iconic Center Deepasthambham (Pillar of Lights) -->
  <!-- Central Brass Column -->
  <line x1="80" y1="42" x2="80" y2="148" stroke="url(#goldStroke)" stroke-width="3" stroke-linecap="round"/>

  <!-- Multi-Tiered Circular Oil Lamp Discs (Thattukal) stacking upwards -->
  <path d="M68 142 Q80 145 92 142" fill="none" stroke="url(#goldStroke)" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M69 133 Q80 136 91 133" fill="none" stroke="url(#goldStroke)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M70 124 Q80 127 90 124" fill="none" stroke="url(#goldStroke)" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M71 115 Q80 118 89 115" fill="none" stroke="url(#goldStroke)" stroke-width="2.3" stroke-linecap="round"/>
  <path d="M72 106 Q80 109 88 106" fill="none" stroke="url(#goldStroke)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M73 97 Q80 100 87 97" fill="none" stroke="url(#goldStroke)" stroke-width="2.1" stroke-linecap="round"/>
  <path d="M74 88 Q80 91 86 88" fill="none" stroke="url(#goldStroke)" stroke-width="2" stroke-linecap="round"/>
  <path d="M75 79 Q80 82 85 79" fill="none" stroke="url(#goldStroke)" stroke-width="1.9" stroke-linecap="round"/>
  <path d="M76 70 Q80 73 84 70" fill="none" stroke="url(#goldStroke)" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M77 61 Q80 63 83 61" fill="none" stroke="url(#goldStroke)" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M77.5 52 Q80 54 82.5 52" fill="none" stroke="url(#goldStroke)" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M78 44 Q80 46 82 44" fill="none" stroke="url(#goldStroke)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Top Crown Finial (Garuda Sthambham Cap) -->
  <ellipse cx="80" cy="42" rx="3.5" ry="1.5" fill="url(#goldStroke)"/>

  <!-- Radiant Sacred Flame on Top of Deepasthambham -->
  <g filter="url(#softGlow)">
    <path d="M80 24 C83 30, 85 34, 83 39 C82 42, 78 42, 77 39 C75 34, 77 30, 80 24 Z" fill="url(#flameGlow)"/>
    <ellipse cx="80" cy="35" rx="1.8" ry="3.5" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>
