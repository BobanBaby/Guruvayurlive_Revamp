<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="60%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="flameGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.6"/>

  <!-- Sacred Lamp (Nilavilakku / Diya) Base & Stem -->
  <!-- Base Pedestal -->
  <path d="M22 52 Q32 49 42 52 L40 55 Q32 54 24 55 Z" fill="url(#goldGrad)"/>
  
  <!-- Stem -->
  <path d="M30 38 L34 38 L33 49 L31 49 Z" fill="url(#goldGrad)"/>
  <ellipse cx="32" cy="44" rx="4" ry="1.5" fill="#fef08a"/>

  <!-- Oil Basin (Thattu) -->
  <ellipse cx="32" cy="38" rx="14" ry="4.5" fill="url(#goldGrad)"/>
  <ellipse cx="32" cy="37" rx="11" ry="2.8" fill="#78350f"/>

  <!-- Sacred Flame (Deepam) -->
  <g filter="url(#glow)">
    <!-- Outer Flame -->
    <path d="M32 12 C37 20, 39 26, 37 32 C35 36, 29 36, 27 32 C25 26, 27 20, 32 12 Z" fill="url(#flameGlow)"/>
    <!-- Inner Radiant Core -->
    <path d="M32 18 C34 23, 35 27, 34 31 C33 33, 31 33, 30 31 C29 27, 30 23, 32 18 Z" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Crown Finial Top -->
  <circle cx="32" cy="11" r="1.5" fill="#fef08a"/>
</svg>
